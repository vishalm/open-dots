name: open-dots

services:
  postgres:
    image: postgres:17-alpine
    container_name: open-dots-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-open_dots}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-open_dots}
      POSTGRES_DB: ${POSTGRES_DB:-open_dots}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-open_dots} -d ${POSTGRES_DB:-open_dots}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
